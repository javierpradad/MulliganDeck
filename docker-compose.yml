services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mulligandeck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=mulligandeck;Username=postgres;Password=${POSTGRES_PASSWORD};Include Error Detail=true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: